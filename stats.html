<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats</title>
  <style>
    body {
      background: url('background.png') center/cover no-repeat;
      position: relative;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
    }
    .back-button {
      position: fixed;
      top: -10px;
      left: -10px;
      width: 96px;
      height: 96px;
      border: none;
      background: transparent;
      color: white;
      border-radius: 0;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      z-index: 100;
      transition: transform 0.2s ease;
      padding: 0;
    }
    .back-button:hover {
      background: transparent;
      transform: scale(1.02);
    }
    .back-button img {
      width: 96px;
      height: 96px;
      display: block;
    }
    .page-shell {
      max-width: 1100px;
      margin: 24px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
      padding: 20px;
    }
    h1 {
      margin-top: 0;
      color: #1a202c;
    }
    p { line-height: 1.6; }
    .close-link { display: inline-block; margin-top: 12px; padding: 8px 12px; background: #4f46e5; color: white; border-radius: 999px; text-decoration: none; border: none; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .close-link:hover { transform: scale(1.08); }
    .target-summary { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
    .target-card { flex:1; min-width:180px; background:#f8fafc; border-radius:12px; padding:16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); }
    .target-card h3 { margin:0 0 8px 0; font-size:14px; color:#111827; }
    .target-card p { margin:0; font-size:18px; font-weight:700; }
    .screentime-panel { margin-bottom:24px; background:#f8fafc; border-radius:16px; padding:18px; }
    .st-row { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:16px; }
    .st-block { padding:14px; border-radius:16px; background:white; box-shadow:0 4px 18px rgba(15,23,42,0.06); }
    .st-label { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:#4b5563; margin-bottom:8px; }
    .st-value { font-size:20px; font-weight:700; color:#111827; }
    .st-pct { font-size:13px; color:#6b7280; margin-top:6px; }
    .top-apps-label { margin-top:12px; font-size:13px; color:#374151; font-weight:600; }
    .top-apps { list-style:none; margin:12px 0 0; padding:0; }
    .top-apps li { display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid #e5e7eb; font-size:14px; }
    .app-meta { color:#6b7280; font-size:12px; margin-left:8px; }

    /* Analysis meter and charts */
    .analysis-row { display: flex; gap: 20px; align-items: center; margin-bottom: 18px; }
    .meter-card { flex: 0 0 120px; max-height: 140px; background:#f8fafc; border-radius:10px; padding:10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); overflow: hidden; }
    .meter-title { font-weight:600; margin-bottom:8px; }
    .meter-value { font-size: 14px; margin-top:8px; }
    .meter { width:100%; height:18px; appearance:none; -webkit-appearance:none; border-radius:9px; background:linear-gradient(90deg,#34d399 0%,#f97316 50%,#ef4444 100%); overflow:hidden; }
    .meter > progress { width:100%; }

    .charts { flex: 1; display:flex; gap:12px; }
    .chart-card { flex:1; background:#fff; border-radius:10px; padding:12px; box-shadow:0 6px 18px rgba(10,20,30,0.04);} 
    .chart-card { min-height: 220px; display: flex; flex-direction: column; }
    .chart-card canvas { width: 100% !important; height: 220px !important; max-height: 320px; }
    .chart-controls { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .small { font-size:13px; color:#555; }

    @media (max-width: 900px) { .analysis-row { flex-direction:column; } .meter-card{width:100%} .charts{flex-direction:column;} }
  </style>
</head>
<body>
  <button class="back-button" onclick="window.location.href='mainpage.html';" title="Back to main">
    <img src="arrow.png" alt="Back" style="width:96px;height:96px;display:block;" />
  </button>
  <div class="page-shell">
    <!-- Back to Main link removed per UI update -->
    <h1>Analysis</h1>
    <div id="target-summary" class="target-summary"></div>
    <div id="screentime-panel" class="screentime-panel"></div>
    <div class="analysis-row">
      <div class="meter-card">
        <div class="meter-title">Burnout Risk</div>
        <div id="burnout-meter-wrap">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="flex:1">
              <div style="height:6px;background:#e6e6e9;border-radius:8px;overflow:hidden;">
                <div id="burnout-fill" style="height:100%;width:0%;background:linear-gradient(90deg,#34d399,#f59e0b,#ef4444);transition:width 600ms;"></div>
              </div>
            </div>
            <div id="burnout-text" style="width:62px;text-align:right;font-weight:600">0%</div>
          </div>
          <div class="meter-value small" id="burnout-reasons" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;margin-top:6px;">Calculating…</div>
        </div>
        <div style="margin-top:0px;font-size:13px;color:#666">4-day stress sum: <span id="stress-4d">—</span></div>
      </div>

      <div class="charts">
        <div class="chart-card">
          <div class="chart-controls">
            <label class="small">Date vs</label>
            <select id="timeseries-metric">
              <option value="stress">Stress</option>
              <option value="happiness">Happiness</option>
              <option value="confidence">Confidence</option>
              <option value="workScreenTime">Work Screen Time</option>
              <option value="casualScreenTime">Casual Screen Time</option>
              <option value="taskCompletionRate">Task Completion Rate</option>
            </select>
            <button id="refresh-timeseries" class="small">Refresh</button>
          </div>
          <canvas id="timeseries-chart" height="200"></canvas>
        </div>

        <div class="chart-card">
          <div class="chart-controls">
            <label class="small">X-axis</label>
            <select id="xy-x">
              <option value="workScreenTime">Work Screen Time</option>
              <option value="casualScreenTime">Casual Screen Time</option>
              <option value="confidence">Confidence</option>
            </select>
            <label class="small">Y-axis</label>
            <select id="xy-y">
              <option value="stress">Stress</option>
              <option value="happiness">Happiness</option>
              <option value="confidence">Confidence</option>
            </select>
            <button id="refresh-xy" class="small">Refresh</button>
          </div>
          <canvas id="xy-chart" height="200"></canvas>
        </div>
      </div>
    </div>

    <!-- Bottom close link removed; use main menu exit button instead -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="stats.js"></script>

</body>
</html>
