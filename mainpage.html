<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mainJohn</title>
  <link rel="stylesheet" href="mainpage.css" />
</head>
<body>
    
  <div class="bottom-bar">
    <button id="bot-btn-1">Stats</button>
    <button id="bot-btn-2">Schedule</button>
    <button id="bot-btn-3">Settings</button>
    <button id="bot-btn-4">Questionnaire</button>
  </div>
  <img src="mainJohn.png" alt="John" class="corner-avatar" />
  <script>
    document.getElementById('bot-btn-1').addEventListener('click', () => {
      window.location.href = 'stats.html';
    });
    document.getElementById('bot-btn-2').addEventListener('click', () => {
      window.location.href = 'schedule.html';
    });
    document.getElementById('bot-btn-3').addEventListener('click', () => {
      window.location.href = 'settings.html';
    });
    document.getElementById('bot-btn-4').addEventListener('click', () => {
      window.location.href = 'questionaire.html';
    });

    const questionnaireNavButton = document.getElementById('bot-btn-4');
    const QUESTIONNAIRE_KEY = 'dailyQuestionnaireEntries';

    function getTodayDate() {
      return new Date().toISOString().slice(0, 10);
    }

    function hasQuestionnaireForDate(date) {
      const stored = localStorage.getItem(QUESTIONNAIRE_KEY);
      const items = stored ? JSON.parse(stored) : [];
      return items.some(item => item.date === date);
    }

    function updateQuestionnaireNav() {
      if (!questionnaireNavButton) return;
      const completed = hasQuestionnaireForDate(getTodayDate());
      questionnaireNavButton.disabled = completed;
      questionnaireNavButton.textContent = completed ? 'Questionnaire Done' : 'Questionnaire';
      questionnaireNavButton.style.opacity = completed ? '0.6' : '';
      questionnaireNavButton.style.cursor = completed ? 'not-allowed' : '';
    }

    updateQuestionnaireNav();
  </script>
</body>
</html>
