<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mainJohn</title>
  <link rel="stylesheet" href="mainpage.css" />
</head>
<body>
  <div class="header-logo">
    <img src="logo.png" alt="Logo" />
  </div>
  <div class="bottom-bar">
    <button id="bot-btn-1">Stats</button>
    <button id="bot-btn-3">Settings</button>
    <button id="bot-btn-4">Questionaire</button>
  </div>
  <button id="store-button" class="store-button" title="Open store">store</button>
  <img src="mainJohn.png" alt="John" class="corner-avatar" />
  <script>
    document.getElementById('bot-btn-1').addEventListener('click', () => {
      window.location.href = 'stats.html';
    });
    document.getElementById('bot-btn-3').addEventListener('click', () => {
      window.location.href = 'settings.html';
    });
    document.getElementById('bot-btn-4').addEventListener('click', () => {
      window.location.href = 'questionaire.html';
    });
    document.getElementById('store-button').addEventListener('click', () => {
      window.location.href = 'store.html';
    });

    const cornerAvatar = document.querySelector('.corner-avatar');
    if (cornerAvatar) {
      cornerAvatar.addEventListener('click', () => {
        try {
          const { ipcRenderer } = require('electron');
          ipcRenderer.send('show-mascot-popup');
        } catch (e) {
          console.log('IPC not available');
        }
      });
      cornerAvatar.style.cursor = 'pointer';
    }

    const questionnaireNavButton = document.getElementById('bot-btn-4');
    const QUESTIONNAIRE_KEY = 'dailyQuestionnaireEntries';

    function getTodayDate() {
      return new Date().toISOString().slice(0, 10);
    }

    function hasQuestionnaireForDate(date) {
      const stored = localStorage.getItem(QUESTIONNAIRE_KEY);
      const items = stored ? JSON.parse(stored) : [];
      return items.some(item => item.date === date);
    }

    function updateQuestionnaireNav() {
      if (!questionnaireNavButton) return;
      questionnaireNavButton.disabled = false;
      questionnaireNavButton.textContent = 'Questionnaire';
      questionnaireNavButton.style.opacity = '';
      questionnaireNavButton.style.cursor = '';
    }

    updateQuestionnaireNav();
  </script>
</body>
