<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fb;
      color: #333;
      margin: 0;
      padding: 24px;
      position: relative;
    }
    .back-button {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      border: none;
      background: #dc2626;
      color: white;
      border-radius: 999px;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
      z-index: 100;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .back-button:hover {
      background: #991b1b;
      transform: scale(1.08);
    }
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fb;
      color: #333;
      margin: 0;
      padding: 24px;
    }
    .page-shell {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.08);
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      color: #1a202c;
    }
    p {
      line-height: 1.6;
    }
    .close-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      background: #4f46e5;
      color: white;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="window.location.href='mainpage.html';" title="Back to main">←</button>
  <div class="page-shell">
    <h1>App Settings</h1>
    <p>This is a new page opened from the home screen. You can use this page to show additional content, instructions, or a separate tool.</p>
    <a href="javascript:window.close()" class="close-link">Close</a>
  </div>

  <script src="js/settings.js"></script>

</body>
</html>
