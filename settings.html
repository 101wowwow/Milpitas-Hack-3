<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="fonts/inter.css" />
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8f9fb;
      color: #333;
      margin: 0;
      padding: 24px;
      position: relative;
    }
    .back-button {
      position: fixed;
      top: -10px;
      left: -10px;
      width: 96px;
      height: 96px;
      border: none;
      background: transparent;
      color: white;
      border-radius: 0;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      z-index: 100;
      transition: transform 0.2s ease;
      padding: 0;
    }
    .back-button:hover {
      background: transparent;
      transform: scale(1.02);
    }
    .back-button img {
      width: 96px;
      height: 96px;
      display: block;
    }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8f9fb;
      color: #333;
      margin: 0;
      padding: 24px;
    }
    .page-shell {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.08);
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      color: #1a202c;
    }
    p {
      line-height: 1.6;
    }
    .close-link {
      display: inline-block;
      margin-bottom: 24px;
      padding: 10px 16px;
      background: #3cb639;
      color: #3cb639;
      border-radius: 10px;
      text-decoration: none;
    }
    .settings-section { margin-top: 24px; }
    .settings-form, .rule-form { display: grid; gap: 14px; }
    .form-row { display: grid; gap: 8px; }
    .form-row label { font-weight: 600; color: #374151; }
    .form-row input, .form-row select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    .primary-button, .secondary-button { cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
    .primary-button { background: #3cb639; color: white; }
    .secondary-button { background: #eef2ff; color: #3cb639; }
    .app-rules-list-wrap { overflow-x: auto; margin-top: 14px; }
    #app-rules-table { width: 100%; border-collapse: collapse; }
    #app-rules-table th, #app-rules-table td { padding: 10px 12px; border: 1px solid #e5e7eb; text-align: left; }
    #app-rules-table th { background: #f3f4f6; }
    .small { font-size: 13px; color: #6b7280; }
    .remove-rule-button { background: transparent; color: #ef4444; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(239,68,68,0.15); cursor: pointer; }
  </style>
</head>
<body>
  <button class="back-button" onclick="window.location.href='mainpage.html';" title="Back to main">
    <img src="arrow.png" alt="Back" style="width:96px;height:96px;display:block;" />
  </button>
  <div class="page-shell">
    <h1>Screen Time Settings</h1>
    <p>Configure daily work/casual goals and keep a preset app/website grouping list.</p>

    <section class="settings-section">
      <h2>Daily target hours</h2>
      <form id="goals-form" class="settings-form">
        <div class="form-row">
          <label for="target-work">Work target (hours)</label>
          <input id="target-work" type="number" step="0.5" min="0" />
        </div>
        <div class="form-row">
          <label for="target-casual">Casual target (hours)</label>
          <input id="target-casual" type="number" step="0.5" min="0" />
        </div>
        <div class="form-actions">
          <button type="submit" class="primary-button">Save targets</button>
        </div>
      </form>
    </section>

    <section class="settings-section">
      <h2>App / website groups</h2>
      <p>Use keyword rules to place apps and sites into <strong>work</strong> or <strong>casual</strong>.</p>
      <div id="app-rules-summary" class="small"></div>
      <div class="app-rules-list-wrap">
        <table id="app-rules-table">
          <thead>
            <tr><th>Keyword</th><th>Group</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <form id="rule-form" class="rule-form">
        <div class="form-row">
          <label for="rule-keyword">Keyword</label>
          <input id="rule-keyword" type="text" placeholder="instagram, google drive, notion" required />
        </div>
        <div class="form-row">
          <label for="rule-group">Group</label>
          <select id="rule-group">
            <option value="work">Work</option>
            <option value="casual">Casual</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary-button">Add / update rule</button>
          <button type="button" id="reset-defaults" class="secondary-button">Reset presets</button>
        </div>
      </form>
    </section>
  </div>

  <script src="settings.js"></script>

</body>
</html>
