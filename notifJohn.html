
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="fonts/inter.css" />
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .speech-bubble {
      background: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 5px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      -webkit-app-region: no-drag;
    }
    .mascot-wrapper {
      position: relative;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    .mascot-image {
      width: 80px;
      height: 80px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      display: block;
    }
    .mascot-hat {
      position: absolute;
      top: -10px;
      left: 58%;
      transform: translateX(-50%);
      width: 50px;
      height: auto;
      pointer-events: none;
    }
    .mascot-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }

    .hidden {
      display: none;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>

  <div class="mascot-container">
    <div class="speech-bubble">
      Time to Take a Rest!<br>You have been on your computer for 10 secs!
    </div>

    <div class="mascot-wrapper">
      <img id="mascotIcon" class="mascot-image" src="John.png" alt="John the Mascot">
      <img id="mascotHat" class="mascot-hat hidden" src="" alt="John's Hat" />
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const mascotIcon = document.getElementById('mascotIcon');
    mascotIcon.addEventListener('click', () => {
      ipcRenderer.send('toggle-main-window');
    });

    function applySelectedHatToMascot() {
      const selectedHat = localStorage.getItem('selectedHat');
      const mascotHat = document.getElementById('mascotHat');
      if (!mascotHat) return;
      if (selectedHat && ['hat1', 'hat2', 'hat3'].includes(selectedHat)) {
        mascotHat.src = `${selectedHat}.png`;
        mascotHat.alt = "John's Hat";
        mascotHat.classList.remove('hidden');
      } else {
        mascotHat.src = '';
        mascotHat.alt = '';
        mascotHat.classList.add('hidden');
      }
    }

    window.addEventListener('storage', event => {
      if (event.key === 'selectedHat') {
        applySelectedHatToMascot();
      }
    });

    applySelectedHatToMascot();

    setTimeout(() => {
      window.close();
    }, 7000);
  </script>

</body>
</html>
