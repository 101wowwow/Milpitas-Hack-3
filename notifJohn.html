
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .speech-bubble {
      background: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 5px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      -webkit-app-region: no-drag;
    }
    .mascot-image {
      width: 80px;
      height: 80px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      animation: float 3s ease-in-out infinite;
    }
    .mascot-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>

  <div class="mascot-container">
    <div class="speech-bubble">
      Time to Take a Rest!<br>You have been on your computer for 10 secs!
    </div>

    <img id="mascotIcon" class="mascot-image" src="john.png" alt="John the Mascot">
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const mascotIcon = document.getElementById('mascotIcon');
    mascotIcon.addEventListener('click', () => {
      ipcRenderer.send('toggle-main-window');
    });

    setTimeout(() => {
      window.close();
    }, 7000);
  </script>

</body>
</html>
